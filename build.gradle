plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.4'
    id "org.jsonschema2pojo" version "1.2.1"
    id 'com.google.protobuf' version '0.9.4'
    id 'jacoco'
    id 'org.openapi.generator' version '7.12.0'
    id 'java-test-fixtures'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        freeCompilerArgs.add("-Xjsr305=strict")
    }
}

// Ensure the Java compiler reports many errors/warnings instead of stopping early
// This helps CI show all compilation issues in one run
tasks.withType(JavaCompile).configureEach {
    // Increase maximum number of diagnostics shown by javac
    options.compilerArgs += ['-Xmaxerrs', '1000', '-Xmaxwarns', '1000']
}

jacoco {
  toolVersion = '0.8.13'
  reportsDirectory = layout.buildDirectory.dir('test-report')
}


group = 'com.java-template'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// Separate configuration for the OTel Java agent — kept off the compile/runtime classpath
// so it can be passed as -javaagent (JVM instrumentation), not a classpath entry.
configurations {
    otelAgent
}

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/generated/source/proto/main/java"
            srcDirs += "$buildDir/generated/source/proto/main/grpc"
            srcDirs += "$buildDir/generated-sources/js2p"
            srcDirs += "$buildDir/generated-sources/openapi/src/main/java"
        }
        kotlin {
            srcDirs += "src/main/kotlin"
        }
        proto {
            srcDir layout.buildDirectory.dir('cyoda-proto/main')
        }
    }
    test {
        kotlin {
            srcDirs += "src/test/kotlin"
        }
    }
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // Kotlin dependencies
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.3'
    implementation 'org.springframework.boot:spring-boot-starter' // Version managed by Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client' // Version managed by Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server' // JWT validation; delete when switching to real IdP
    implementation 'org.springframework.boot:spring-boot-starter-validation' // Jakarta validation
    implementation 'org.springframework.data:spring-data-commons' // For Page and Pageable


    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'io.grpc:grpc-protobuf:1.73.0'
    implementation 'io.grpc:grpc-core:1.73.0'
    implementation 'io.grpc:grpc-stub:1.73.0'

    implementation 'io.grpc:grpc-all:1.73.0'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    implementation 'io.cloudevents:cloudevents-protobuf:4.0.1'
    implementation 'io.cloudevents:cloudevents-json-jackson:4.0.1'
    implementation 'io.cloudevents:cloudevents-spring:4.0.1'

    // cloudevents.proto is import-only; io.cloudevents.v1.proto.CloudEvent comes from cloudevents-protobuf (spec §3.3.1)
    compileProtoPath files(layout.buildDirectory.dir('cyoda-proto/include')) {
        builtBy 'prepareCyodaProto'
    }

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.apache.httpcomponents.client5:httpclient5:5.5'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3'
    implementation 'com.fasterxml.uuid:java-uuid-generator:4.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // OpenTelemetry observability — API and annotations only (agent provides SDK at runtime)
    implementation 'io.opentelemetry:opentelemetry-api:1.44.1'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.11.0'
    // OTel Java agent — resolved to a file path for -javaagent, not placed on the classpath
    otelAgent 'io.opentelemetry.javaagent:opentelemetry-javaagent:2.11.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // JSON structured logging for ELK/Kubernetes (logback encoder)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    implementation 'com.eaio.uuid:uuid:3.2'
    implementation 'com.beust:jcommander:1.82'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.junit:junit-bom:5.13.1')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.1'
    testImplementation 'org.instancio:instancio-junit:5.5.1'
    testImplementation("org.junit.platform:junit-platform-suite")
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing:1.44.1'
    testImplementation 'org.awaitility:awaitility:4.2.2'

    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testFixturesImplementation platform('org.junit:junit-bom:5.13.1')
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation testFixtures(project)

    integrationTestImplementation testFixtures(project)
}

test {
    useJUnitPlatform()

    // Pass system properties to tests (needed for conditional test execution).
    // Override user.dir so relative File paths in tests resolve against the
    // subproject directory, not the workspace root where gradlew was invoked.
    systemProperties = System.properties
    systemProperty 'user.dir', project.projectDir.absolutePath
}

def cyodaPin = file('src/main/resources/cyoda/CYODA_VERSION')

tasks.register('integrationTest', Test) {
    description = 'Tier-1 integration tests against a cyoda-go subprocess (mock IAM, memory storage)'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    systemProperty 'user.dir', project.projectDir.absolutePath
    systemProperty 'cyoda.pinFile', cyodaPin.absolutePath
    systemProperty 'cyoda.logDir', layout.buildDirectory.dir('cyoda-logs').get().asFile.absolutePath
    ['cyoda.bin', 'cyoda.allowVersionMismatch'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
    inputs.file cyodaPin
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('check') { dependsOn 'integrationTest' }

jacocoTestReport {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.from = files(
            layout.buildDirectory.file('jacoco/test.exec'),
            layout.buildDirectory.file('jacoco/integrationTest.exec'))
    reports.xml.required = true
}

tasks.register('prepareEventSchemas', com.cyoda.build.PrepareEventSchemasTask) {
    sourceDir = file('src/main/resources/cyoda/schema')
    outputDir = layout.buildDirectory.dir('cyoda-schema')
}

jsonSchema2Pojo {
    source = files(layout.buildDirectory.dir('cyoda-schema'))
    targetDirectory = file("$buildDir/generated-sources/js2p")
    targetPackage = 'org.cyoda.cloud.api.event'
    generateBuilders = true
    usePrimitives = false
    includeAdditionalProperties = false
    includeHashcodeAndEquals = true
    includeToString = true
    annotationStyle = 'jackson2'
    sourceType = 'jsonschema'
    removeOldOutput = true
    includeConstructors = false
    includeRequiredPropertiesConstructor = false
    includeAllPropertiesConstructor = true
    // cyoda-go emits date-time fields (format: date-time) with full nanosecond precision
    // (Go's time.RFC3339Nano). java.util.Date (the jsonschema2pojo default) only carries
    // millisecond precision, so round-tripping a server timestamp through it silently floors
    // sub-millisecond digits. Since cyoda-go v0.9 compares point-in-time reads at native
    // precision with no millisecond rounding (cyoda-go changelog, issue #349), that floored
    // value lands strictly before the entity's true commit instant and an exact-instant
    // reload (EntityServiceImpl.create()/update()) never finds its own just-written version.
    // OffsetDateTime matches the openapi-generated models (org.cyoda.cloud.api.common.model),
    // which already use it, and is lossless for RFC3339Nano text. No schema in this project
    // uses "format": "date" or "format": "time" (date-time only), so dateType is left alone.
    dateTimeType = 'java.time.OffsetDateTime'
}

tasks.named('generateJsonSchema2Pojo') { dependsOn 'prepareEventSchemas' }

tasks.register('prepareCyodaProto', com.cyoda.build.PrepareCyodaProtoTask) {
    sourceDir = file('src/main/resources/cyoda/proto')
    outputDir = layout.buildDirectory.dir('cyoda-proto')
}

// buildSrc's own tests (e.g. ProtoOptionInjectorTest) are not run by :build/:test/:check in
// Gradle 8 — buildSrc is built before the root build starts and its `test` task never becomes
// a dependency of the root project's tasks. Wire it in explicitly so CI gates on it.
//
// GradleBuild cannot target buildSrc directly ("build name 'buildSrc' which cannot be used as
// it is a reserved name" — it is Gradle's own included build, not an ordinary one), so this
// forks the wrapper as a separate process against the buildSrc build instead.
tasks.register('buildLogicTest', Exec) {
    description = 'Runs the unit tests of the build logic in buildSrc'
    group = 'verification'
    workingDir = rootDir
    commandLine com.cyoda.build.GradleWrapperCommand.of(
            org.gradle.internal.os.OperatingSystem.current().isWindows(), '-p', 'buildSrc', 'test')
}

tasks.named('check') { dependsOn 'buildLogicTest' }

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.31.1'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.73.0'
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.dependsOn 'prepareCyodaProto'
            task.plugins { grpc {} }
        }
    }
}

tasks.matching { it.name == 'extractIncludeProto' }.configureEach { dependsOn 'prepareCyodaProto' }

// The protobuf plugin folds sourceSets.main.proto into main resources (so raw .proto files are
// packaged), which makes processResources an implicit consumer of prepareCyodaProto's output.
// Exclude the build-modified copy (with injected java_* options) so only the vendored original
// under cyoda/proto/... ships in the jar; there is no reason to ship the same contract twice.
tasks.named('processResources') {
    dependsOn 'prepareCyodaProto'
    exclude 'cyoda/cyoda-cloud-api.proto'
}

// OpenAPI DTOs come from cyoda-go's single api/openapi.yaml. PrepareOpenApiTask writes a patched
// copy (cyoda-go #625 discriminator mappings, #627 array values) that the generator reads.
tasks.register('prepareOpenApi', com.cyoda.build.PrepareOpenApiTask) {
    sourceFile = file('src/main/resources/cyoda/openapi/openapi.yaml')
    outputFile = layout.buildDirectory.file('cyoda-openapi/openapi.yaml')
}

tasks.register('generateOpenApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    description = 'Generates Java DTOs from cyoda-go api/openapi.yaml (patched copy)'
    group = 'openapi tools'
    dependsOn 'prepareOpenApi'
    generatorName = 'spring'
    inputSpec = layout.buildDirectory.file('cyoda-openapi/openapi.yaml').get().asFile.path
    outputDir = "$buildDir/generated-sources/openapi"
    // Drop DTOs left by the former per-area specs (workflow/search/audit/iam packages, *OperatorDto)
    cleanupOutput = true
    modelPackage = 'org.cyoda.cloud.api.common.model'
    apiPackage = 'org.cyoda.cloud.api.common.api'
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
        dateLibrary: 'java8',
        useJakartaEe: 'true',
        openApiNullable: 'false',
        serializationLibrary: 'jackson',
        interfaceOnly: 'true',
        useSpringBoot3: 'true',
        useBeanValidation: 'true',
        containerDefaultToNull: 'true',
    ]
    globalProperties = [models: '', apis: 'false', supportingFiles: '']
    typeMappings = [object: 'JsonNode', any: 'JsonNode', AnyType: 'JsonNode']
    importMappings = [JsonNode: 'com.fasterxml.jackson.databind.JsonNode']
    // The only inline oneOf wrapper that does not compile (spec §3.3.3)
    schemaMappings = [TransitionDefinitionDto_processors_inner: 'ExternalizedProcessorDefinitionDto']
}

["bootRun", "build", "compileJava", "compileKotlin"].each { taskName ->
    tasks.named(taskName).configure {
        dependsOn("generateProto")
        dependsOn("generateJsonSchema2Pojo")
        dependsOn("generateOpenApi")
    }
}

tasks.named("compileTestKotlin").configure {
    dependsOn("generateTestProto")
}

tasks.named("compileTestJava").configure {
    dependsOn("generateTestProto")
}

bootJar {
    mainClass.set("com.java_template.Application")
    archiveFileName.set("app.jar")
}

// java-test-fixtures wires `testImplementation testFixtures(project)` as a project dependency on
// this project's own testFixtures capability, which transitively resolves main's apiElements /
// runtimeElements — i.e. the plain jar. Disabling it left that artifact missing and broke
// compileTestKotlin (Kotlin's build-tools-api classpath snapshot transform silently drops the
// unresolvable entry, then reports symbols in src/main/kotlin as unresolved in test code).
// The plain jar is otherwise unused; bootJar (app.jar) remains the shipped artifact.
jar {
    enabled = true
}

bootRun {
    mainClass.set("com.java_template.Application")
}

// Prototype mode is handled via conditional test: ./gradlew test --tests PrototypeApplicationTest -Dprototype.enabled=true

task bootJarWorkflowImport(type: org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    description = 'Boot JAR for Workflow Import Tool'
    archiveClassifier.set("workflow-import")
    mainClass.set("com.java_template.common.tool.WorkflowImportTool")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    launchScript()
    classpath = sourceSets.main.runtimeClasspath
    mainClassName = "com.java_template.common.tool.WorkflowImportTool"
    targetJavaVersion = JavaVersion.VERSION_21
    dependsOn configurations.runtimeClasspath
}

tasks.register('runApp', JavaExec) {
    group = 'application'
    description = 'Run arbitrary main class'
    classpath = sourceSets.main.runtimeClasspath
    def requestedMain = project.findProperty('mainClass') ?: 'com.java_template.Application'
    mainClass.set(requestedMain.toString())
    systemProperties = System.properties
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    })
    // Attach the OTel agent when the observability stack is running locally.
    // Start the stack first: docker compose -f docker/observability/docker-compose.yml up -d
    if (project.findProperty('otel') == 'true') {
        jvmArgs "-javaagent:${configurations.otelAgent.asPath}"
        environment 'OTEL_SERVICE_NAME', 'java-template-backend'
        environment 'OTEL_METRICS_EXPORTER', 'prometheus'
        environment 'OTEL_EXPORTER_PROMETHEUS_PORT', '9464'
        environment 'OTEL_TRACES_EXPORTER', 'otlp'
        environment 'OTEL_EXPORTER_OTLP_TRACES_ENDPOINT', 'http://localhost:4318'
        environment 'OTEL_LOGS_EXPORTER', 'none'  // Tempo handles traces only; no log backend in local stack
        environment 'OTEL_INSTRUMENTATION_GRPC_ENABLED', 'true'
        environment 'OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED', 'true'
        environment 'OTEL_INSTRUMENTATION_JDBC_ENABLED', 'true'
        environment 'OTEL_INSTRUMENTATION_EXECUTOR_ENABLED', 'true'
    }
}

tasks.register('runTestApp', JavaExec) {
    group = 'application'
    description = 'Run arbitrary test class with Spring Boot context'
    classpath = sourceSets.test.runtimeClasspath
    def requestedMain = project.findProperty('mainClass') ?: 'com.java_template.Application'
    mainClass.set(requestedMain.toString())
    args = project.findProperty('args')?.toString()?.split(' ') ?: []
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    })
}


tasks.register('validateWorkflowImplementations', JavaExec) {
    group = 'validation'
    description = 'Validate that all processors/criteria in workflows exist as Java classes. Usage: -Pargs="path/to/workflow.json" (optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.java_template.common.tool.WorkflowImplementationValidator')
    if (project.hasProperty('args')) {
        args project.property('args').toString().split(' ')
    }
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    })
}

tasks.register('validateFunctionalRequirements', JavaExec) {
    group = 'validation'
    description = 'Validate that all processors/criteria in requirements are implemented in workflows. Usage: -Pargs="requirements.md workflow.json" (optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.java_template.common.tool.FunctionalRequirementsValidator')
    if (project.hasProperty('args')) {
        args project.property('args').toString().split(' ')
    }
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    })
}

tasks.register('validateWorkflows', JavaExec) {
    group = 'validation'
    description = 'Run complete workflow validation suite'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.java_template.common.tool.WorkflowValidationSuite')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    })
}

// Prints the resolved OTel agent jar path — use this to configure IntelliJ VM options.
tasks.register('printOtelAgentPath') {
    group = 'help'
    description = 'Print the resolved OTel Java agent jar path for use in IDE run configurations'
    doLast {
        println configurations.otelAgent.asPath
    }
}


