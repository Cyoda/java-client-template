name: Build Application
run-name: Build [${{ inputs.branch || github.ref_name }}] • ${{ inputs.build_type || 'standard' }} • ${{ inputs.tracker_id || 'N/A' }}


on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string
      build_type:
        description: 'Type of build to perform'
        required: false
        default: 'standard'
        type: choice
        options:
          - compile-only
          - test-only
          - workflow-validation
          - standard
          - workflow-import
          - both
      tracker_id:
        description: 'Unique tracker ID for identifying this run'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'standard' }}
      BRANCH: ${{ inputs.branch || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Only workflow_dispatch supplies a branch. On push/pull_request the
          # input is empty and checkout falls back to the event's own ref
          # (e.g. refs/pull/<n>/merge). BRANCH is for display/summary only:
          # on pull_request github.ref_name is "<n>/merge", which checkout
          # cannot resolve.
          ref: ${{ inputs.branch }}

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Artifact name suffix
        # upload-artifact rejects '/' in names; branch names and PR refs ("<n>/merge") contain it.
        run: |
          suffix="${BRANCH//\//-}"
          echo "ARTIFACT_SUFFIX=$suffix" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile only (report all compilation errors)
        if: ${{ env.BUILD_TYPE == 'compile-only' || env.BUILD_TYPE == 'workflow-validation' }}
        run: |
          echo "::notice::Starting compilation check for branch $BRANCH"
          # Clean first to ensure a full recompile so all diagnostics are surfaced
          # Use --continue so Gradle doesn't stop at the first failing task
          # Use --console=plain and -i to make sure all javac diagnostics are printed in GH Actions logs
          # Compile main, test, test-fixtures and integration-test sources to catch all compilation errors
          ./gradlew clean compileJava compileTestJava compileTestFixturesJava compileIntegrationTestJava --continue --console=plain -i
          status=$?
          if [ $status -eq 0 ]; then
            echo "::notice::✅ Compilation successful - no errors found in main or test sources"
            echo "COMPILE_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "::error::❌ Compilation failed - see above for all reported errors"
            echo "COMPILE_STATUS=failure" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Set up Go (source build of the pinned cyoda)
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'test-only' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.7'

      - name: Install pinned cyoda
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'test-only' }}
        # Two statements so a failed install fails the step; inside a single
        # echo the command substitution's exit status is discarded.
        run: |
          bin="$(scripts/install-cyoda.sh)"
          echo "CYODA_BIN=$bin" >> "$GITHUB_ENV"

      - name: Run tests (unit + tier-1 integration)
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'test-only' }}
        run: ./gradlew check

      - name: Upload cyoda logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyoda-logs-${{ github.run_id }}
          path: build/cyoda-logs/
          retention-days: 7

      - name: Run workflow validation test
        if: ${{ env.BUILD_TYPE == 'workflow-validation' }}
        run: ./gradlew validateWorkflowImplementations --console=plain

      - name: Build standard JAR
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'both' }}
        run: ./gradlew bootJar

      - name: Build workflow import JAR
        if: ${{ env.BUILD_TYPE == 'workflow-import' || env.BUILD_TYPE == 'both' }}
        run: ./gradlew bootJarWorkflowImport

      - name: Upload standard build artifacts
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'both' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standard-jar-${{ env.ARTIFACT_SUFFIX }}
          path: build/libs/app.jar
          retention-days: 30

      - name: Upload workflow import build artifacts
        if: ${{ env.BUILD_TYPE == 'workflow-import' || env.BUILD_TYPE == 'both' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-import-jar-${{ env.ARTIFACT_SUFFIX }}
          path: build/libs/*-workflow-import.jar
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-${{ env.ARTIFACT_SUFFIX }}
          path: |
            build/test-results/test/
            build/test-results/integrationTest/
          retention-days: 7

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-reports-${{ env.ARTIFACT_SUFFIX }}
          path: |
            build/reports/tests/test/
            build/reports/tests/integrationTest/
          retention-days: 7

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3

      - name: Lint and render the chart
        run: |
          helm lint helm -f .github/helm/ci-values.yaml
          helm template ci helm -f .github/helm/ci-values.yaml > /dev/null

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'standard' }}
      BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Build Summary
        # Every value reaches the script through env, never as an expression inside the script: a branch
        # name or a dispatch input is user-controlled and would otherwise be spliced into the shell.
        env:
          TRACKER_ID: ${{ inputs.tracker_id || 'N/A' }}
          BUILD_RESULT: ${{ needs.build.result }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          {
            echo "## 🚀 Build Summary"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Branch** | \`$BRANCH\` |"
            echo "| **Build Type** | \`$BUILD_TYPE\` |"
            echo "| **Tracker ID** | \`$TRACKER_ID\` |"
            if [[ "$BUILD_RESULT" == "success" ]]; then
              echo "| **Status** | ✅ Success |"
            else
              echo "| **Status** | ❌ Failed |"
            fi
            echo "| **Triggered by** | @$ACTOR |"
            echo "| **Run ID** | [\`$GITHUB_RUN_ID\`]($RUN_URL) |"
            echo "| **Commit** | [\`${GITHUB_SHA:0:7}\`]($COMMIT_URL) |"
            echo ""

            if [[ "$BUILD_TYPE" == "compile-only" ]]; then
              echo "### 🔍 Compilation Check Results"
              if [[ "$BUILD_RESULT" == "success" ]]; then
                echo "✅ **All Java files compiled successfully** - No compilation errors found!"
              else
                echo "❌ **Compilation failed** - Please check the build logs for error details."
              fi
            elif [[ "$BUILD_TYPE" == "workflow-validation" ]]; then
              echo "### 🔍 Workflow Validation Results"
              if [[ "$BUILD_RESULT" == "success" ]]; then
                echo "✅ **All workflow components validated successfully** - All processors and criteria have corresponding Java implementations!"
              else
                echo "❌ **Workflow validation failed** - Some processors or criteria are missing their Java implementation files. Please check the build logs for details."
              fi
            else
              echo "### 📦 Build Artifacts"
              echo "Build artifacts are available in the [Actions tab]($RUN_URL) for 30 days."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
