name: Build Application
run-name: Build [${{ inputs.branch || github.ref_name }}] • ${{ inputs.build_type || 'standard' }} • ${{ inputs.tracker_id || 'N/A' }}


on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string
      build_type:
        description: 'Type of build to perform'
        required: false
        default: 'standard'
        type: choice
        options:
          - compile-only
          - test-only
          - workflow-validation
          - standard
          - workflow-import
          - both
      tracker_id:
        description: 'Unique tracker ID for identifying this run'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'standard' }}
      BRANCH: ${{ inputs.branch || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Only workflow_dispatch supplies a branch. On push/pull_request the
          # input is empty and checkout falls back to the event's own ref
          # (e.g. refs/pull/<n>/merge). BRANCH is for display/summary only:
          # on pull_request github.ref_name is "<n>/merge", which checkout
          # cannot resolve.
          ref: ${{ inputs.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile only (report all compilation errors)
        if: ${{ env.BUILD_TYPE == 'compile-only' || env.BUILD_TYPE == 'workflow-validation' }}
        run: |
          echo "::notice::Starting compilation check for branch ${{ env.BRANCH }}"
          # Clean first to ensure a full recompile so all diagnostics are surfaced
          # Use --continue so Gradle doesn't stop at the first failing task
          # Use --console=plain and -i to make sure all javac diagnostics are printed in GH Actions logs
          # Compile main, test, test-fixtures and integration-test sources to catch all compilation errors
          ./gradlew clean compileJava compileTestJava compileTestFixturesJava compileIntegrationTestJava --continue --console=plain -i
          status=$?
          if [ $status -eq 0 ]; then
            echo "::notice::✅ Compilation successful - no errors found in main or test sources"
            echo "COMPILE_STATUS=success" >> $GITHUB_ENV
          else
            echo "::error::❌ Compilation failed - see above for all reported errors"
            echo "COMPILE_STATUS=failure" >> $GITHUB_ENV
            exit 1
          fi

      - name: Set up Go (source build of the pinned cyoda)
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'test-only' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Install pinned cyoda
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'test-only' }}
        # Two statements so a failed install fails the step; inside a single
        # echo the command substitution's exit status is discarded.
        run: |
          bin="$(scripts/install-cyoda.sh)"
          echo "CYODA_BIN=$bin" >> "$GITHUB_ENV"

      - name: Run tests (unit + tier-1 integration)
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'test-only' }}
        run: ./gradlew check

      - name: Upload cyoda logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cyoda-logs-${{ github.run_id }}
          path: build/cyoda-logs/
          retention-days: 7

      - name: Run workflow validation test
        if: ${{ env.BUILD_TYPE == 'workflow-validation' }}
        run: ./gradlew test --tests WorkflowComponentValidationStandaloneTest

      - name: Build standard JAR
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'both' }}
        run: ./gradlew bootJar

      - name: Build workflow import JAR
        if: ${{ env.BUILD_TYPE == 'workflow-import' || env.BUILD_TYPE == 'both' }}
        run: ./gradlew bootJarWorkflowImport

      - name: Upload standard build artifacts
        if: ${{ env.BUILD_TYPE == 'standard' || env.BUILD_TYPE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: standard-jar-${{ env.BRANCH }}
          path: build/libs/app.jar
          retention-days: 30

      - name: Upload workflow import build artifacts
        if: ${{ env.BUILD_TYPE == 'workflow-import' || env.BUILD_TYPE == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-import-jar-${{ env.BRANCH }}
          path: build/libs/*-workflow-import.jar
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ env.BRANCH }}
          path: |
            build/test-results/test/
            build/test-results/integrationTest/
          retention-days: 7

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ env.BRANCH }}
          path: |
            build/reports/tests/test/
            build/reports/tests/integrationTest/
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'standard' }}
      BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Build Summary
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ env.BRANCH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | \`${{ env.BUILD_TYPE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tracker ID** | \`${{ inputs.tracker_id || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run ID** | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ env.BUILD_TYPE }}" == "compile-only" ]]; then
            echo "### 🔍 Compilation Check Results" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "✅ **All Java files compiled successfully** - No compilation errors found!" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Compilation failed** - Please check the build logs for error details." >> $GITHUB_STEP_SUMMARY
            fi
          elif [[ "${{ env.BUILD_TYPE }}" == "workflow-validation" ]]; then
            echo "### 🔍 Workflow Validation Results" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "✅ **All workflow components validated successfully** - All processors and criteria have corresponding Java implementations!" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Workflow validation failed** - Some processors or criteria are missing their Java implementation files. Please check the build logs for details." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "Build artifacts are available in the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for 30 days." >> $GITHUB_STEP_SUMMARY
          fi
