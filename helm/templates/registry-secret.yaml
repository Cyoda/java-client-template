{{- define "imagePullSecret" }}
{{- with .Values.global.registry -}}
{{- $auth := printf "%s:%s" (required "global.registry.username is required for global.imagePullSecret.enabled" .username) (required "global.registry.password is required for global.imagePullSecret.enabled" .password) | b64enc -}}
{{- printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" .host $auth  | b64enc -}}
{{- end -}}
{{- end -}}

{{- /* Legacy: prefer global.imagePullSecret.existingSecretName, which creates nothing. */ -}}
{{- if and .Values.global.imagePullSecret.enabled (not .Values.global.imagePullSecret.existingSecretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  annotations:
    "helm.sh/hook": "pre-install, pre-upgrade, pre-delete"
    "helm.sh/hook-weight": "-70"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
