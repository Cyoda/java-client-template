name: cyoda-client

imagePullSecret:
  enabled: true

enabled: true
useNamespaceForIngress: false

imagePullSecrets:
  - name: regcred

# Enable Spring Boot Actuator health endpoints
actuatorEnabled: true

container:
  env:
    # Plain environment variables. Names bind to app.config.* through Spring Boot's relaxed binding
    # (APP_CONFIG_GRPC_SERVER_PORT -> app.config.grpc-server-port). Never put the client secret here: it
    # comes from a Secret (cyodaClientSecret below).
    vars:
      # Timezone
      TZ: /usr/share/zoneinfo/Europe/Berlin

      # Cyoda Connection (REQUIRED - must be set via --set or values override)
      APP_CONFIG_CYODA_HOST: ""  # e.g., client-05e11da2107844fc944ee5b872fcb6b6.kube3.cyoda.org
      APP_CONFIG_CYODA_CLIENT_ID: ""

      # gRPC Configuration
      APP_CONFIG_GRPC_PROCESSOR_TAG: cyoda_application
      APP_CONFIG_GRPC_SERVER_PORT: "443"

      # Optional Configuration
      APP_CONFIG_HANDSHAKE_TIMEOUT_MS: "5000"
      APP_CONFIG_INITIAL_RECONNECT_DELAY_MS: "200"
      APP_CONFIG_MAX_RECONNECT_DELAY_MS: "10000"
      APP_CONFIG_FAILED_RECONNECTS_LIMIT: "10"
      APP_CONFIG_GRPC_COMMUNICATION_DATA_FORMAT: "JSON"

      # Monitoring
      APP_CONFIG_SENT_EVENTS_CACHE_MAX_SIZE: "100"
      APP_CONFIG_MONITORING_SCHEDULER_INITIAL_DELAY_SECONDS: "1"
      APP_CONFIG_MONITORING_SCHEDULER_DELAY_SECONDS: "3"
      APP_CONFIG_KEEP_ALIVE_WARNING_THRESHOLD: "60000"

      # SSL Configuration
      APP_CONFIG_SSL_TRUST_ALL: "false"
      APP_CONFIG_SSL_TRUSTED_HOSTS: ""

      # Feature Flags
      APP_CONFIG_INCLUDE_DEFAULT_OPERATIONS: "false"

    # Additional environment variables can be added here
    additionalVars: {}

    # ConfigMaps to load as environment variables
    configMaps: []

    # Secrets to load as environment variables
    secrets: []

# The M2M client secret (app.config.cyoda-client-secret) is read from an existing Kubernetes Secret and
# passed as APP_CONFIG_CYODA_CLIENT_SECRET through secretKeyRef; the chart never takes the value itself.
# Create it first, e.g.:
#   kubectl create secret generic cyoda-client-credentials --from-literal=client-secret=<secret>
cyodaClientSecret:
  secretName: ""  # REQUIRED
  key: client-secret

podAnnotations: {}

health:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 120
    timeoutSeconds: 5
    periodSeconds: 30
    failureThreshold: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 120
    timeoutSeconds: 5
    periodSeconds: 30
    failureThreshold: 10

service:
  name: cyoda-client-service
  type: NodePort
  serverPort:
    port: 8080
    target: 8080
    name: http

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  path: /
  pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

extraVolumeMounts: {}
extraVolumes: {}
securityContext: {}
tolerations: []
priorityClassName: ""
serviceAccountName: ""
nodeSelector: {}
affinity: {}
strategy: {}

image:
  pullPolicy: Always
  imageName: client-app